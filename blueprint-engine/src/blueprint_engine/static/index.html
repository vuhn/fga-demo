<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blueprint engine harness</title>
<style>
  :root { --bg: #fff; --fg: #1d1d1f; --muted: #6b6b70; --line: #d9d9de; --accent: #2457d6; }
  @media (prefers-color-scheme: dark) { :root { --bg: #17171a; --fg: #ececf0; --muted: #9a9aa3; --line: #34343a; --accent: #7aa2ff; } }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.45 system-ui, sans-serif; background: var(--bg); color: var(--fg); }
  header { padding: 12px 16px; border-bottom: 1px solid var(--line); }
  header small { color: var(--muted); }
  main { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 16px; padding: 16px; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
  #sheet { background: #fff; border: 1px solid var(--line); min-height: 300px; }
  #sheet svg { width: 100%; height: auto; display: block; }
  section { margin-bottom: 14px; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 0 0 6px; }
  textarea, input[type=text] { width: 100%; font: inherit; color: inherit; background: transparent; border: 1px solid var(--line); border-radius: 6px; padding: 8px; }
  textarea.json { font: 12px/1.4 ui-monospace, monospace; height: 260px; }
  button { font: inherit; padding: 6px 12px; border-radius: 6px; border: 1px solid var(--accent); background: var(--accent); color: #fff; cursor: pointer; }
  button.ghost { background: transparent; color: var(--accent); }
  button:disabled { opacity: .5; cursor: wait; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
  ul { margin: 0; padding-left: 18px; }
  .err { color: #c62828; } .warn { color: #b26a00; } .ok { color: #2e7d32; }
</style>
</head>
<body>
<header><strong>Blueprint engine</strong> <small>dev harness, talks to this engine directly (the app goes through the Go API)</small></header>
<main>
  <div><div id="sheet"><p style="padding:16px;color:#666">Describe a house or load a sample brief.</p></div></div>
  <aside>
    <section>
      <h2>1. Describe</h2>
      <textarea id="prompt" rows="3">A 3-bedroom family house on a 20 x 30 m lot, entrance from the south, open living room, kitchen next to dining, master bedroom with ensuite.</textarea>
      <div class="row"><button id="fromText">Draft brief</button>
        <label class="ghost"><input type="file" id="sketch" accept="image/png,image/jpeg,application/pdf,.dxf"> sketch</label></div>
    </section>
    <section>
      <h2>2. Brief (editable)</h2>
      <textarea id="brief" class="json"></textarea>
      <div class="row"><button id="gen">Generate</button><button class="ghost" id="dxf">DXF</button><button class="ghost" id="pdf">PDF</button></div>
    </section>
    <section>
      <h2>3. Revise</h2>
      <input type="text" id="msg" value="move the kitchen to the north wall">
      <div class="row"><button id="revise">Send</button></div>
    </section>
    <section><h2>Notes and checks</h2><ul id="log"></ul></section>
  </aside>
</main>
<script>
let model = null, version = 0;
const $ = (id) => document.getElementById(id);
const log = (items) => { $("log").innerHTML = items.map(([cls, t]) => `<li class="${cls}">${t.replace(/</g, "&lt;")}</li>`).join(""); };

async function call(path, body, isForm) {
  document.querySelectorAll("button").forEach(b => b.disabled = true);
  try {
    const r = await fetch(path, isForm ? { method: "POST", body } : { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) });
    if (!r.ok) { const e = await r.json().catch(() => ({ message: r.statusText })); throw new Error(e.message || JSON.stringify(e.detail || e)); }
    return r;
  } finally { document.querySelectorAll("button").forEach(b => b.disabled = false); }
}
function brief() { return JSON.parse($("brief").value); }
async function show(step) {
  const res = step.result;
  $("brief").value = JSON.stringify(res.brief, null, 2);
  const items = [...(step.notes || []).map(n => ["", n]), ...res.issues.map(i => ["err", i]),
    ...res.checks.filter(c => !c.ok).map(c => [c.severity === "error" ? "err" : "warn", c.message])];
  if (res.ok) items.unshift(["ok", `all error checks pass (${step.attempts} attempt(s))`]);
  log(items);
  if (!res.model) return;
  model = res.model; version += 1;
  const r = await call("/v1/render", { model, format: "svg", title_block: { project: res.brief.title, version } });
  $("sheet").innerHTML = await r.text();
}
async function download(format) {
  if (!model) return;
  const r = await call("/v1/render", { model, format, title_block: { project: brief().title, version } });
  const a = document.createElement("a"); a.href = URL.createObjectURL(await r.blob()); a.download = `plan-v${version}.${format}`; a.click();
}
const guard = (fn) => async () => { try { await fn(); } catch (e) { log([["err", e.message]]); } };
$("fromText").onclick = guard(async () => {
  const out = await (await call("/v1/brief/from-text", { prompt: $("prompt").value })).json();
  $("brief").value = JSON.stringify(out.brief, null, 2); model = null; version = 0;
  log(out.notes.map(n => ["", n]).concat([["", "review the brief, then Generate"]]));
});
$("sketch").onchange = guard(async () => {
  const f = $("sketch").files[0]; if (!f) return;
  const fd = new FormData(); fd.append("file", f); fd.append("note", $("prompt").value);
  const out = await (await call("/v1/brief/from-sketch", fd, true)).json();
  $("brief").value = JSON.stringify(out.brief, null, 2); model = null; version = 0;
  log(out.notes.map(n => ["", n]));
});
$("gen").onclick = guard(async () => show(await (await call("/v1/generate", { brief: brief(), previous: model, repair: !model })).json()));
$("revise").onclick = guard(async () => show(await (await call("/v1/revise", { brief: brief(), previous: model, message: $("msg").value })).json()));
$("dxf").onclick = guard(() => download("dxf"));
$("pdf").onclick = guard(() => download("pdf"));
</script>
</body>
</html>
