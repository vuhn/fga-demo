[project]
name = "blueprint-engine"
version = "0.1.0"
description = "Text2Blueprint engine: brief JSON -> floor plan (DXF, SVG, PDF). Stateless; called only by the Go API."
requires-python = ">=3.13"
dependencies = [
    "ezdxf==1.4.5",
    "fastapi==0.162.5",
    "httpx==0.28.1",
    "ifcopenshell==0.9.0.post1",
    "matplotlib==3.11.2",
    "pydantic==2.14.3",
    "pypdfium2==5.15.2",
    "python-multipart==0.0.33",
    "shapely==2.2.0",
    "uvicorn[standard]==0.54.0",
]

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest==9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["tests"]
testpaths = ["tests"]
