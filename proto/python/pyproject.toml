[project]
name = "fga-proto"
version = "0.1.0"
description = "Generated Python gRPC stubs for the fga.demo protos (package `fga`). Generated by scripts/gen-proto.sh; never edit by hand."
requires-python = ">=3.13"
dependencies = [
    "grpcio==1.80.0",
    "protobuf==6.33.6",
]

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "fga"
module-root = ""

[dependency-groups]
dev = [
    "grpcio-tools==1.80.0",
]
