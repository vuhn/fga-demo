version: v2
# Go stubs only, into the shared Go module proto/go (module github.com/vuhn/fga-demo/proto/go). Services import it;
# no service holds generated code. Python stubs go to proto/python (package `fga`), generated by scripts/gen-proto.sh
# with grpcio-tools (pinned in proto/python/uv.lock) because buf's Python plugins are remote and this repo does not
# send its protos to a hosted service.
clean: false
plugins:
  - local: protoc-gen-go
    out: go
    opt: paths=source_relative
  - local: protoc-gen-go-grpc
    out: go
    opt: paths=source_relative
