version: v2
# Go stubs only. Python stubs are generated by scripts/gen-proto.sh with grpcio-tools (pinned in each project's
# uv.lock) because buf's Python plugins are remote and this repo does not send its protos to a hosted service.
clean: false
plugins:
  - local: protoc-gen-go
    out: ../api/internal/infrastructure/grpcgen
    opt: paths=source_relative
  - local: protoc-gen-go-grpc
    out: ../api/internal/infrastructure/grpcgen
    opt: paths=source_relative
